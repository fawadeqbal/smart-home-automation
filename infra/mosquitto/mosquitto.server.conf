# Mosquitto 2 on Server B (docker-compose.server.yml).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# The API, inside Docker only (not published)
listener 1883

# Boards, from the internet: TLS with the Let's Encrypt (RSA) certificate the server's Caddy keeps
listener 8883
certfile /mosquitto/certs/cert.pem
keyfile /mosquitto/certs/key.pem
