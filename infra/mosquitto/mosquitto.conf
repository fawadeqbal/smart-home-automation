# Mosquitto 2 - the MQTT broker between the boards and the API.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
# Also to a file the API reads (read-only): which board connected from where, and why it dropped.
log_dest file /mosquitto/log/broker.log
log_type error
log_type warning
log_type notice

# Plain MQTT inside Docker and on the home network.
# In the cloud, boards connect to Traefik on 8883 (TLS) which forwards here.
listener 1883
allow_anonymous false

# Created at start-up from MQTT_API_PASSWORD and MQTT_NODE_PASSWORD (see docker-compose.yml)
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
