# The whole platform. On the cloud server:   docker compose -f infra/docker-compose.yml --profile cloud up -d
# On your PC use the dev override as well (see docker-compose.dev.yml and README.md).
name: home-platform

services:
  # ------------------------------------------------------------ the only public entry (cloud)
  traefik:
    image: traefik:v3.1
    profiles: [cloud]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.mqtts.address=:8883
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/certs/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports: ["80:80", "443:443", "8883:8883"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/certs

  # ------------------------------------------------------------ data
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: home
      POSTGRES_USER: home
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home -d home"]
      interval: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:?set MQTT_API_PASSWORD in .env}
      MQTT_NODE_PASSWORD: ${MQTT_NODE_PASSWORD:?set MQTT_NODE_PASSWORD in .env}
    # Builds the password file from .env on every start, then runs the broker.
    command:
      - sh
      - -c
      - >-
        mkdir -p /mosquitto/log && touch /mosquitto/log/broker.log &&
        chown -R mosquitto:mosquitto /mosquitto/log && chmod 0644 /mosquitto/log/broker.log &&
        if [ $$(wc -c < /mosquitto/log/broker.log) -gt 2097152 ]; then tail -n 8000 /mosquitto/log/broker.log > /tmp/l && cat /tmp/l > /mosquitto/log/broker.log; fi &&
        rm -f /mosquitto/data/passwd &&
        mosquitto_passwd -c -b /mosquitto/data/passwd api "$$MQTT_API_PASSWORD" &&
        mosquitto_passwd -b /mosquitto/data/passwd node "$$MQTT_NODE_PASSWORD" &&
        chown mosquitto:mosquitto /mosquitto/data/passwd && chmod 0700 /mosquitto/data/passwd &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.mqtt.rule=HostSNI(`mqtt.${DOMAIN:-localhost}`)
      - traefik.tcp.routers.mqtt.entrypoints=mqtts
      - traefik.tcp.routers.mqtt.tls.certresolver=le
      - traefik.tcp.services.mqtt.loadbalancer.server.port=1883

  # ------------------------------------------------------------ apps
  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://home:${POSTGRES_PASSWORD}@postgres:5432/home
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD}
      MQTT_NODE_PASSWORD: ${MQTT_NODE_PASSWORD}
      MQTT_PUBLIC_PORT: ${MQTT_PUBLIC_PORT:-8883}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://${DOMAIN}}
      FIRMWARE_DIR: /data/firmware
      BROKER_LOG: /broker-log/broker.log
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://${DOMAIN}}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ASSISTANT_URL: http://assistant:8000
      ASSISTANT_SHARED_SECRET: ${ASSISTANT_SHARED_SECRET:?set ASSISTANT_SHARED_SECRET in .env}
      API_PORT: 4000
    volumes:
      - api-data:/data
      - mosquitto-log:/broker-log:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`))
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=4000

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:4000
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=3000

  assistant:
    build: { context: ../apps/assistant }
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      ASSISTANT_SHARED_SECRET: ${ASSISTANT_SHARED_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-5-5}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      LANGUAGE: ${LANGUAGE:-}
      PIPER_MODEL: ${PIPER_MODEL:-models/en_US-lessac-medium.onnx}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ../apps/assistant/models:/app/models

volumes:
  api-data:
  certs:
  pgdata:
  mosquitto-data:
  mosquitto-log:
