<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Switchboard</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f7f7f8;color:#111318;text-align:center;padding:24px}
  @media (prefers-color-scheme:dark){body{background:#0b0c0f;color:#eef0f4}}
  .box{max-width:360px} .mark{width:64px;height:64px;border-radius:18px;background:#4f46e5;margin:0 auto 20px}
  p{color:#8a909c;line-height:1.5} button{margin-top:12px;height:44px;padding:0 20px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font:inherit;font-weight:600}
</style></head>
<body><div class="box"><div class="mark"></div><h1>You’re offline</h1>
<p>This phone or computer can’t reach your home server right now. Your wall switches still work.</p>
<button onclick="location.reload()">Try again</button></div></body></html>
